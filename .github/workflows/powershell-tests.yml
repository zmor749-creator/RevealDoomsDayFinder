name: PowerShell regression tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Windows PowerShell 5.1 synthetic regression suite
        shell: powershell
        run: ./tests/Test-DoomsDayFinder.ps1
      - name: PowerShell 7 synthetic regression suite
        shell: pwsh
        run: ./tests/Test-DoomsDayFinder.ps1
      - name: Windows PowerShell synthetic performance sample
        shell: powershell
        run: ./tests/Measure-DoomsDayFinder.ps1
      - name: Windows PowerShell targeted profile performance sample
        shell: powershell
        run: ./tests/Measure-DoomsDayFinder.ps1 -Profile Signatures
